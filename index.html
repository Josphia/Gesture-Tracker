<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Canvas Pro</title>

<style>
html,body{
margin:0;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
}
#video{
position:fixed;
inset:0;
width:100vw;
height:100vh;
object-fit:cover;
transform:scaleX(-1);
}
#drawCanvas,#overlayCanvas{
position:fixed;
inset:0;
}
#toolbar{
position:fixed;
top:15px;
left:15px;
z-index:100;
background:rgba(0,0,0,.55);
padding:12px;
border-radius:14px;
display:flex;
gap:8px;
align-items:center;
}
.color{
width:28px;
height:28px;
border-radius:50%;
cursor:pointer;
border:2px solid white;
}
button{
padding:8px 12px;
cursor:pointer;
border:none;
border-radius:8px;
}
#info{
position:fixed;
bottom:15px;
left:15px;
color:white;
background:rgba(0,0,0,.5);
padding:10px;
border-radius:12px;
z-index:100;
}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="drawCanvas"></canvas>
<canvas id="overlayCanvas"></canvas>

<div id="toolbar">
<div class="color" style="background:red" data-color="red"></div>
<div class="color" style="background:deepskyblue" data-color="deepskyblue"></div>
<div class="color" style="background:lime" data-color="lime"></div>
<div class="color" style="background:yellow" data-color="yellow"></div>
<div class="color" style="background:violet" data-color="violet"></div>
<div class="color" style="background:white" data-color="white"></div>

<button id="eraser">Eraser</button>
<button id="clear">Clear</button>
<button id="save">Save</button>
</div>

<div id="info">
☝️ Index finger = Draw<br>
✌️ Two fingers = Pause/Select<br>
✊ Fist = Erase
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const video = document.getElementById("video");
const drawCanvas = document.getElementById("drawCanvas");
const overlayCanvas = document.getElementById("overlayCanvas");

const drawCtx = drawCanvas.getContext("2d");
const overlayCtx = overlayCanvas.getContext("2d");

function resize() {
  drawCanvas.width = overlayCanvas.width = window.innerWidth;
  drawCanvas.height = overlayCanvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let currentColor = "deepskyblue";
let eraser = false;
let lastX = null, lastY = null;

document.querySelectorAll(".color").forEach(el => {
  el.onclick = () => {
    currentColor = el.dataset.color;
    eraser = false;
  };
});

document.getElementById("eraser").onclick = () => {
  eraser = true;
};

document.getElementById("clear").onclick = () => {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
};

document.getElementById("save").onclick = () => {
  const temp = document.createElement("canvas");
  temp.width = drawCanvas.width;
  temp.height = drawCanvas.height;
  const t = temp.getContext("2d");

  t.translate(temp.width, 0);
  t.scale(-1, 1);
  t.drawImage(video, 0, 0, temp.width, temp.height);
  
  t.setTransform(1, 0, 0, 1, 0, 0);
  t.drawImage(drawCanvas, 0, 0);

  const a = document.createElement("a");
  a.href = temp.toDataURL("image/png");
  a.download = "air_canvas_pro.png";
  a.click();
};

function drawSmooth(x, y, size) {
  if (lastX === null) {
    lastX = x;
    lastY = y;
    return;
  }

  const sx = lastX * 0.75 + x * 0.25;
  const sy = lastY * 0.75 + y * 0.25;

  drawCtx.lineCap = "round";
  drawCtx.lineJoin = "round";
  drawCtx.lineWidth = size;

  if (eraser) {
    drawCtx.globalCompositeOperation = "destination-out";
    drawCtx.shadowBlur = 0;
  } else {
    drawCtx.globalCompositeOperation = "source-over";
    drawCtx.strokeStyle = currentColor;
    
    drawCtx.shadowColor = currentColor;
    drawCtx.shadowBlur = 20; 
  }

  drawCtx.beginPath();
  drawCtx.moveTo(lastX, lastY);
  drawCtx.lineTo(sx, sy);
  drawCtx.stroke();

  lastX = sx;
  lastY = sy;
}

function resetStroke() {
  lastX = null;
  lastY = null;
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.75,
  minTrackingConfidence: 0.75
});

hands.onResults((results) => {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) {
    resetStroke();
    return;
  }

  const lm = results.multiHandLandmarks[0];

  overlayCtx.save();
  overlayCtx.scale(-1, 1);
  overlayCtx.translate(-overlayCanvas.width, 0);

  drawConnectors(overlayCtx, lm, HAND_CONNECTIONS, { color: "#00FF66", lineWidth: 3 });
  drawLandmarks(overlayCtx, lm, { color: "#FF007F", radius: 4 });

  overlayCtx.restore();

  const indexUp = lm[8].y < lm[6].y;
  const middleUp = lm[12].y < lm[10].y;
  const ringUp = lm[16].y < lm[14].y;
  const pinkyUp = lm[20].y < lm[18].y;

  const fingersUp = [indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length;

  const x = (1 - lm[8].x) * drawCanvas.width;
  const y = lm[8].y * drawCanvas.height;

  const brush = Math.max(2, Math.min(12, Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y) * 100));

  if (fingersUp === 0) {
    eraser = true; 
    drawSmooth(x, y, 100);
    return;
  }

  if (indexUp && middleUp && !ringUp && !pinkyUp) {
    resetStroke();  

    const elements = document.elementsFromPoint(x, y);
    elements.forEach(el => {
      if (el.classList.contains("color")) {
        currentColor = el.dataset.color;
        eraser = false;
      } else if (el.id === "eraser") {
        eraser = true;
      } else if (el.id === "clear") {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      }
    });
  } 

  else if (indexUp && !middleUp && !ringUp && !pinkyUp) {
    eraser = false; 
    drawSmooth(x, y, brush);
  } else {
    resetStroke();
  }

  overlayCtx.beginPath();
  overlayCtx.arc(x, y, eraser ? 22 : brush / 2 + 4, 0, Math.PI * 2);
  overlayCtx.fillStyle = eraser ? "rgba(255, 0, 0, 0.4)" : currentColor;
  overlayCtx.fill();
});

navigator.mediaDevices.getUserMedia({
  video: { width: 1280, height: 720 }
}).then(stream => {
  video.srcObject = stream;
  
  video.onloadedmetadata = () => {
    resize();
  };

  const camera = new Camera(video, {
    onFrame: async () => {
      await hands.send({ image: video });
    },
    width: 1280,
    height: 720
  });

  camera.start();
});
</script>
</body>
</html>
